# run in development

name: tcc-p2p
services:

  influxdb:
    image: influxdb:2.9.1
    restart: unless-stopped
    environment:
      # read only on the first start, with an empty volume
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?defina no .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?defina no .env}   # minimum 8 characters
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?defina no .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?defina no .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?defina no .env}
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      retries: 10

  grafana:
    image: grafana/grafana:13.1.2-ubuntu
    restart: unless-stopped
    depends_on:
      influxdb: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  peer:
    build:  
      context: https://github.com/PolianaCSousa/TCC.git#swarm-connect
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: tcc-peer:latest
    network_mode: host
    restart: unless-stopped
    init: true                    # forwards SIGTERM to Python
    stop_grace_period: 15s
    depends_on:
      influxdb: { condition: service_healthy }
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_MEASUREMENT: ${INFLUXDB_MEASUREMENT}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    ports:
      - "4001:4001/tcp"          # libp2p
      - "4001:4001/udp"          # libp2p via QUIC
    volumes:
      - ./data/peer:/data        # results.csv + logs/
    # no CPU/memory limit: limiting would bias the measured throughput

volumes:
  influx-data:
  influx-config:
  grafana-data: