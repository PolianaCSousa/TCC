#env_file:
#- /caminho/para/o/seu/.env_externo
#environment:
#- API_TOKEN=${NOME_DA_VARIAVEL_NO_ENV_EXTERNO}


  influxdb:
    image: influxdb:2.9.1
    restart: unless-stopped
    environment:
      # só o entrypoint da imagem lê estas — e só na primeira subida, com o volume vazio
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:?defina no .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?defina no .env}   # mínimo 8 caracteres
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?defina no .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?defina no .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?defina no .env}
      # URL e MEASUREMENT não existem no servidor: são do cliente, ficam no serviço peer
    volumes:
      - influx-data:/var/lib/influxdb2 # eu preciso definir pastas no pc pra salvar os dados, pois uma vez que o container morre, os dados se perdem (antes dos : sao as pastas da minha máquina, e depois dos : são as pastas do container) - verificar quais pastas do influx eu preciso fazer backup
      - influx-config:/etc/influxdb2
    ports:
      - "127.0.0.1:8086:8086"     # computador:container
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      retries: 10

  grafana:
    image: grafana/grafana:13.1.2-ubuntu
    restart: unless-stopped
    depends_on:
      influxdb: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  peer:
    build:
      context: https://github.com/PolianaCSousa/TCC.git#docker
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: tcc-peer:latest
    restart: unless-stopped
    init: true                    # PID 1 de verdade: repassa SIGTERM ao Python
    stop_grace_period: 15s
    # sem network_mode: usa a rede do Compose, que existe igual em Linux, Mac e
    # Windows. A contrapartida é que as medições atravessam a ponte do Docker —
    # irrelevante para latência e vazão, mas registre na metodologia, porque a
    # camada extra de NAT pode influenciar o candidate_type.
    depends_on:
      #ipfs:     { condition: service_healthy }
      influxdb: { condition: service_healthy }
    environment:
      KUBO_API: http://ipfs:5001    # nome do serviço: o Compose resolve como DNS
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_MEASUREMENT: ${INFLUXDB_MEASUREMENT}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      TURN_API_KEY: ${TURN_API_KEY}
      # inertes por enquanto: IPFS_TOPIC e TEST_INTERVAL_SECONDS estão fixos em
      # constants.py e PEER_NAME não é lido por ninguém. Descomentar quando o
      # código passar a ler do ambiente.
      # IPFS_TOPIC: ${IPFS_TOPIC:-tcc-polics}
      # TEST_INTERVAL_SECONDS: ${TEST_INTERVAL_SECONDS:-30}
      # PEER_NAME: ${PEER_NAME:-peer1}
    volumes:
      - ./data/peer:/data        # results.csv + logs/
    # sem ports: e sem cpus:/mem_limit: — limitar CPU enviesa a vazão medida

volumes:
 #ipfs-data:
  influx-data:
  influx-config:
  grafana-data: