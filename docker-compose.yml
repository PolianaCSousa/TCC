  #  ports:
  #    - "4001:4001/tcp"           # libp2p
  #    - "4001:4001/udp"           # libp2p via QUIC
  #    - "127.0.0.1:5001:5001"     # RPC = admin sem autenticação: NUNCA em 0.0.0.0
  #  healthcheck:
  #    test: ["CMD-SHELL", "ipfs --api=/ip4/127.0.0.1/tcp/5001 swarm peers >/dev/null 2>&1 || exit 1"]
  #    interval: 10s
